<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Login</title>
</head>
<body>
    <form action="login">
        <h1>Login</h1>

        <input id="email" class="input-block" title="email" type="text" placeholder="Email">
        <input id="username" class="input-block" title="password" type="text" placeholder="Username">

        <div class="block-text" id="mid-text">
            <input title="remember" type="checkbox" name="Remember me" id="checkbox">
            <label for="remember">Remember me</label>
            <a href=""><p>Forgot password</p></a>
        </div>

        <button id="submit" type="submit">Login</button>

        <p class="block-text">Don't have an account? <a href="signup.html">Register</a></p>
    </form>
</body>
</html>
