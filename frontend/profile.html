<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="profile.js"></script>
    <title>My profile</title>
</head>
<body>
    <div id="profile-container">
        <h1>Hello Name tag</h1>
        <label for="FirstName"></label>
        <input id="firstname" class="input-block" title="FirstName" type="text" placeholder="Firstname">

        <label for="LastName"></label>
        <input id="lastname" class="input-block" title="LastName" type="text" placeholder="Last Name">

        <label for="PhoneNumber"></label>
        <input id="phonenum" class="input-block" title="PhoneNumber" type="text" placeholder="Phone Number">

        <label for="Age"></label>
        <input id="age" class="input-block" title="Age" type="text" placeholder="Age">

        <button id="makeChanges" type="button" title="changes">Apply Changes</button>
        <button id="update" type="button" title="update">Edit Profile</button>
        
    </div>
</body>
</html>
